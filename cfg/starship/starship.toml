"$schema" = 'https://starship.rs/config-schema.json'
# one #545479 block for work dir with path font color using white, branch & time

format = """
$directory\
$git_branch\
$git_status\
$c\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
$conda\
$time\
$cmd_duration\
$line_break\
$character"""

palette = 'lucy'

[os]
disabled = true


[directory]
style = "bg:block fg:primary"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:block"
format = '[[$symbol $branch ](fg:secondary bg:block)]($style)'

[git_status]
style = "bg:block"
format = '[[($all_status$ahead_behind )](fg:secondary bg:block)]($style)'

[nodejs]
symbol = ""
style = "bg:block"
format = '[[ $symbol( $version) ](fg:secondary bg:block)]($style)'

[bun]
symbol = ""
style = "bg:block"
format = '[[ $symbol( $version) ](fg:secondary bg:block)]($style)'

[c]
symbol = " "
style = "bg:block"
format = '[[ $symbol( $version) ](fg:secondary bg:block)]($style)'

[rust]
symbol = ""
style = "bg:block"
format = '[[ $symbol( $version) ](fg:secondary bg:block)]($style)'

[golang]
symbol = ""
style = "bg:block"
format = '[[ $symbol( $version) ](fg:secondary bg:block)]($style)'

[php]
symbol = ""
style = "bg:block"
format = '[[ $symbol( $version) ](fg:secondary bg:block)]($style)'

[java]
symbol = " "
style = "bg:block"
format = '[[ $symbol( $version) ](fg:secondary bg:block)]($style)'

[kotlin]
symbol = ""
style = "bg:block"
format = '[[ $symbol( $version) ](fg:secondary bg:block)]($style)'

[haskell]
symbol = ""
style = "bg:block"
format = '[[ $symbol( $version) ](fg:secondary bg:block)]($style)'

[python]
symbol = ""
style = "bg:block"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:secondary bg:block)]($style)'

[docker_context]
symbol = ""
style = "bg:block"
format = '[[ $symbol( $context) ](fg:secondary bg:block)]($style)'

[conda]
symbol = "  "
style = "fg:secondary bg:block"
format = '[$symbol$environment ]($style)'
ignore_base = false

[time]
disabled = false
time_format = "%R"
style = "fg:secondary"
format = '[[  $time ](fg:secondary)]($style)'

# Keep this enabled so the input prompt sits on the line below the status bar.
[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:secondary)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:secondary)'
vimcmd_replace_one_symbol = '[❮](bold fg:secondary)'
vimcmd_replace_symbol = '[❮](bold fg:secondary)'
vimcmd_visual_symbol = '[❮](bold fg:secondary)'

[cmd_duration]
show_milliseconds = true
format = " in $duration "
style = "fg:#808080"
disabled = false
show_notifications = true
min_time_to_notify = 45000  # ms — desktop notification when a command runs longer than 45s

[palettes.lucy]
block = "#545479"
primary = "#ffffff"
secondary = "#d1d2fc"
red = "#f38ba8"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
